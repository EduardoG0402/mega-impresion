<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA | Impresión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CORTINA DE ACTUALIZACIÓN (Oculta por defecto) -->
    <div id="update-overlay" class="overlay hidden">
        <div class="spinner"></div>
        <h2>🔄 Actualizando Sistema de Impresión...</h2>
        <p>Descargando nueva versión en segundo plano.</p>
        <p>Por favor espera, el sistema se reiniciará automáticamente.</p>
    </div>

    <div class="header">
        <div class="title-container">
            <img src="assets/logo.png" alt="MEGA Logo" class="logo">
            <h1>Gestor de Impresión</h1>
        </div>
        <div class="badge" id="badge-sucursal">Conectando...</div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Placa</th>
                    <th>Vehículo</th>
                    <th>Hora Captura</th>
                    <th>Capturista</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="cola-impresion">
                <tr>
                    <td colspan="6" class="text-center text-muted">Iniciando conexión con la base de datos central...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
